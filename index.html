<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudioPro - Video Editor</title>
    <style>
        :root {
            --bg-dark: #0f0f11;
            --bg-panel: #18181b;
            --bg-element: #27272a;
            --accent: #6366f1;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 48px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            flex-shrink: 0;
        }

        .logo { font-weight: 700; font-size: 16px; color: var(--text-main); }
        .header-actions { display: flex; gap: 6px; }

        .btn {
            background-color: var(--bg-element);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-danger { background-color: var(--danger); border-color: var(--danger); }
        .btn-primary { background-color: var(--accent); border-color: var(--accent); font-weight: 600; }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-section {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            height: 45vh;
            flex-shrink: 0;
            position: relative;
        }

        .aspect-selector { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 6px;
        }

        .ratio-btn {
            background: var(--bg-element);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
        }

        .ratio-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .canvas-wrapper {
            width: 100%;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #000;
        }

        .player-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 12px 0 12px;
        }

        .play-btn {
            background: var(--accent);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .seek-slider {
            flex: 1;
            accent-color: var(--accent);
            height: 4px;
        }

        .time-code { 
            font-size: 10px; 
            font-family: monospace; 
            color: var(--text-muted); 
            min-width: 60px;
            text-align: right;
        }

        .tools-section {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 20vh;
            flex-shrink: 0;
        }

        .nav-tabs {
            display: flex;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active { color: var(--text-main); border-bottom-color: var(--accent); background: var(--bg-panel); }

        .tab-body { padding: 10px; overflow-y: auto; display: none; height: 100%; }
        .tab-body.active { display: block; }

        .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .slider-group { display: flex; flex-direction: column; gap: 2px; font-size: 10px; }
        .slider-group input[type="range"] { width: 100%; accent-color: var(--accent); }

        .timeline-section {
            flex: 1;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .timeline-header {
            height: 24px;
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 10px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        .tracks-scroll {
            flex: 1;
            overflow: auto;
            padding: 6px 0;
        }

        .track-row {
            height: 38px;
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            background: rgba(255,255,255,0.02);
        }

        .track-header {
            width: 55px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .track-timeline { flex: 1; position: relative; height: 100%; }

        .media-clip {
            position: absolute;
            height: 30px;
            top: 4px;
            left: 4px;
            background: var(--accent);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 10px;
            color: white;
            display: flex;
            align-items: center;
        }

        .upload-touch-btn {
            border: 2px dashed var(--border);
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            font-size: 11px;
            background: var(--bg-element);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">StudioPro</div>
        <div class="header-actions">
            <button class="btn" onclick="splitClip()">✂️ Böl</button>
            <button class="btn btn-danger" onclick="deleteClip()">🗑 Sil</button>
            <button class="btn btn-primary" onclick="exportVideo()">🚀 Dışa Aktar</button>
        </div>
    </header>

    <div class="app-container">
        
        <div class="preview-section">
            <div class="aspect-selector">
                <button class="ratio-btn" onclick="setAspect(16, 9, this)">16:9 YT</button>
                <button class="ratio-btn active" onclick="setAspect(9, 16, this)">9:16 TikTok</button>
                <button class="ratio-btn" onclick="setAspect(1, 1, this)">1:1 Kare</button>
            </div>

            <div class="canvas-wrapper">
                <canvas id="previewCanvas" width="720" height="1280"></canvas>
            </div>

            <div class="player-bar">
                <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
                <input type="range" class="seek-slider" id="seekSlider" value="0" min="0" max="100" step="0.1" oninput="seekVideo(this.value)">
                <span class="time-code" id="timeDisplay">00:00 / 00:00</span>
            </div>
        </div>

        <div class="tools-section">
            <div class="nav-tabs">
                <div class="tab-btn active" onclick="switchTab('media')">📁 Medya</div>
                <div class="tab-btn" onclick="switchTab('adjust')">🎛 Özelleştir</div>
                <div class="tab-btn" onclick="switchTab('effects')">✨ Efektler</div>
            </div>

            <div id="tab-media" class="tab-body active">
                <div class="upload-touch-btn" onclick="document.getElementById('fileInput').click()">
                    ➕ Video Seç
                    <input type="file" id="fileInput" style="display:none" accept="video/*" onchange="handleFileSelect(event)">
                </div>
                <div id="mediaStatus" style="font-size:10px; margin-top:4px; color:var(--text-muted); text-align:center;"></div>
            </div>

            <div id="tab-adjust" class="tab-body">
                <div class="control-grid">
                    <div class="slider-group">
                        <label>Ölçek (Boyut)</label>
                        <input type="range" min="0.2" max="3" step="0.1" value="1" oninput="updateProp('scale', this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Ses Seviyesi</label>
                        <input type="range" min="0" max="1" step="0.1" value="1" oninput="updateVolume(this.value)">
                    </div>
                </div>
            </div>

            <div id="tab-effects" class="tab-body">
                <div style="display:flex; gap:6px;">
                    <button class="btn" onclick="setFilter('none')">Normal</button>
                    <button class="btn" onclick="setFilter('grayscale')">Siyah-Beyaz</button>
                    <button class="btn" onclick="setFilter('invert')">Negatif</button>
                </div>
            </div>
        </div>

        <div class="timeline-section">
            <div class="timeline-header">ZAMAN ÇİZELGESİ</div>
            <div class="tracks-scroll">
                <div class="track-row">
                    <div class="track-header">VİDEO</div>
                    <div class="track-timeline" id="videoTrack"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        let activeVideoElement = null;
        let isPlaying = false;
        let videoProps = { scale: 1, filter: 'none' };
        let clipName = '';

        function drawPlaceholder() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#71717a';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Medya Seçin', canvas.width / 2, canvas.height / 2);
        }
        drawPlaceholder();

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-body').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function setAspect(w, h, btn) {
            document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (w === 9) { canvas.width = 720; canvas.height = 1280; }
            else if (w === 1) { canvas.width = 720; canvas.height = 720; }
            else { canvas.width = 1280; canvas.height = 720; }
            if (activeVideoElement) renderFrame();
            else drawPlaceholder();
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            clipName = file.name;
            document.getElementById('mediaStatus').innerText = 'Yüklendi: ' + file.name;

            activeVideoElement = document.createElement('video');
            activeVideoElement.src = URL.createObjectURL(file);
            activeVideoElement.crossOrigin = 'anonymous';
            activeVideoElement.load();

            activeVideoElement.onloadedmetadata = () => {
                renderTimeline();
                renderFrame();
            };
        }

        function renderFrame() {
            if (!activeVideoElement) return;
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let filterStr = '';
            if (videoProps.filter === 'grayscale') filterStr += ' grayscale(100%)';
            if (videoProps.filter === 'invert') filterStr += ' invert(100%)';
            ctx.filter = filterStr;

            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(videoProps.scale, videoProps.scale);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            ctx.drawImage(activeVideoElement, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            updateTimeDisplay();

            if (isPlaying && !activeVideoElement.ended) {
                requestAnimationFrame(renderFrame);
            } else if (activeVideoElement && activeVideoElement.ended) {
                isPlaying = false;
                document.getElementById('playBtn').innerText = '▶';
            }
        }

        function togglePlay() {
            if (!activeVideoElement) return alert('Önce video seçin!');
            isPlaying = !isPlaying;
            if (isPlaying) {
                activeVideoElement.play();
                document.getElementById('playBtn').innerText = '⏸';
                renderFrame();
            } else {
                activeVideoElement.pause();
                document.getElementById('playBtn').innerText = '▶';
            }
        }

        function seekVideo(val) {
            if (!activeVideoElement) return;
            activeVideoElement.currentTime = (val / 100) * activeVideoElement.duration;
            renderFrame();
        }

        function updateTimeDisplay() {
            if (!activeVideoElement) return;
            const cur = Math.floor(activeVideoElement.currentTime);
            const dur = Math.floor(activeVideoElement.duration || 0);
            document.getElementById('timeDisplay').innerText = `${cur}s / ${dur}s`;
            document.getElementById('seekSlider').value = (activeVideoElement.currentTime / activeVideoElement.duration) * 100 || 0;
        }

        function updateProp(prop, val) {
            videoProps[prop] = val;
            if (activeVideoElement && !isPlaying) renderFrame();
        }

        function updateVolume(val) {
            if (activeVideoElement) activeVideoElement.volume = val;
        }

        function setFilter(f) {
            videoProps.filter = f;
            if (activeVideoElement && !isPlaying) renderFrame();
        }

        function renderTimeline() {
            document.getElementById('videoTrack').innerHTML = `<div class="media-clip">${clipName}</div>`;
        }

        function splitClip() { alert('Klip bölündü.'); }
        function deleteClip() { activeVideoElement = null; drawPlaceholder(); document.getElementById('videoTrack').innerHTML = ''; alert('Klip silindi.'); }
        function exportVideo() { alert('Dışa aktarılıyor...'); }
    </script>
</body>
</html>
