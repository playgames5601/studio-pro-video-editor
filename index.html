<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudioPro - Mobile Video Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">StudioPro</div>
        <div class="header-actions">
            <button class="btn" onclick="document.getElementById('fileInput').click()">➕ Medya</button>
            <button class="btn btn-primary" onclick="exportVideo()">🚀 Dışa Aktar</button>
        </div>
    </header>

    <div class="workspace">
        
        <div class="preview-container">
            <div class="aspect-bar">
                <button class="aspect-btn active" onclick="setAspect(9, 16, this)">9:16 TikTok</button>
                <button class="aspect-btn" onclick="setAspect(16, 9, this)">16:9 YT</button>
                <button class="aspect-btn" onclick="setAspect(1, 1, this)">1:1 Kare</button>
            </div>

            <div class="viewport-wrapper">
                <canvas id="mainCanvas" width="720" height="1280"></canvas>
            </div>
        </div>

        <div class="playback-bar">
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <input type="range" class="seek-slider" id="seekSlider" value="0" min="0" max="100" step="0.1" oninput="seekVideo(this.value)">
            <span class="time-label" id="timeLabel">00:00 / 00:00</span>
        </div>

        <div class="timeline-section">
            <div class="timeline-header">VİDEO KATI</div>
            <div class="tracks-viewport" id="timelineTrack">
                <span style="color:#71717a; font-size:11px;">Henüz medya eklenmedi.</span>
            </div>
        </div>

        <div class="toolbar">
            <button class="tool-btn" onclick="splitClip()"><span>✂️</span>Böl</button>
            <button class="tool-btn" onclick="applyFilter()"><span>✨</span>Filtrele</button>
            <button class="tool-btn" onclick="alert('Ses seviyesi normal')"><span>🔊</span>Ses</button>
            <button class="tool-btn danger" onclick="deleteClip()"><span>🗑</span>Sil</button>
        </div>

    </div>

    <input type="file" id="fileInput" style="display:none" accept="video/*" onchange="loadMedia(event)">

    <script src="app.js"></script>
</body>
</html>
