<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudioPro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b class="logo">StudioPro</b>
  <div class="hr">
    <button class="ib" id="add" aria-label="Medya ekle"></button>
    <button class="pill" id="ratio">9:16</button>
    <button class="pill pri" id="exp">Dışa Aktar</button>
  </div>
</header>
<main id="stage"><canvas id="cv"></canvas></main>
<section class="bar">
  <span id="time"><b id="tc">00:00</b> / <span id="tt">00:00</span></span>
  <button class="round" id="play" aria-label="Oynat"></button>
  <div class="bar-r">
    <button class="ib" id="undo" aria-label="Geri al"></button>
    <button class="ib" id="zo" aria-label="Uzaklaştır">−</button>
    <button class="ib" id="zi" aria-label="Yakınlaştır">+</button>
  </div>
</section>
<section id="tlWrap">
  <div id="tlScroll"><div id="tlInner">
    <div id="ruler"></div>
    <div class="row" data-t="video"></div>
    <div class="row" data-t="text"></div>
    <div class="row" data-t="audio"></div>
  </div></div>
  <div id="head"></div>
</section>
<section id="panel" hidden></section>
<nav id="tools"></nav>
<input type="file" id="file" multiple hidden>
<div id="ovl" hidden></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>
<script src="app.js"></script>
</body>
</html>
