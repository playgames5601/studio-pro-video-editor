<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioPro AI - Pro Video Studio</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-panel: #18181b;
            --bg-element: #27272a;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            height: 50px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: var(--bg-element);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--border);
        }

        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        /* Main Workspace */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 1fr 280px;
            height: calc(100vh - 50px);
        }

        /* Left Panel */
        .left-panel {
            grid-row: 1 / 2;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            background-color: var(--bg-dark);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 10px 4px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--text-main);
            border-bottom-color: var(--accent);
            background-color: var(--bg-panel);
        }

        .tab-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Center Preview */
        .preview-area {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            background-color: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 15px;
        }

        .aspect-ratios {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .ratio-btn {
            background: var(--bg-element);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .ratio-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 4px;
            width: 560px;
            height: 315px;
            transition: all 0.3s ease;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #111;
        }

        .player-controls {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            background: var(--bg-element);
            border: 1px solid var(--border);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .control-btn:hover {
            background: var(--accent);
        }

        /* Right Panel */
        .right-panel {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border);
            padding: 16px;
            overflow-y: auto;
        }

        .panel-section {
            margin-bottom: 20px;
        }

        .panel-section h3 {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prop-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .prop-row input[type="range"] {
            width: 120px;
        }

        .prop-row select {
            background: var(--bg-element);
            border: 1px solid var(--border);
            color: white;
            padding: 4px 6px;
            border-radius: 4px;
            width: 120px;
        }

        .keyframe-btn {
            background: transparent;
            border: 1px dashed var(--accent);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
        }
        .keyframe-btn.active {
            background: var(--accent);
            color: white;
        }

        /* Timeline Area */
        .timeline-area {
            grid-column: 1 / 4;
            grid-row: 2 / 3;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .timeline-toolbar {
            height: 35px;
            background-color: var(--bg-dark);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
        }

        .timeline-tracks-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .timeline-ruler {
            height: 24px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .track {
            height: 48px;
            border-bottom: 1px solid var(--border);
            display: flex;
            position: relative;
            background: rgba(255,255,255,0.01);
        }

        .track-label {
            width: 100px;
            background: var(--bg-dark);
            border-right: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .track-content {
            flex: 1;
            position: relative;
        }

        .clip {
            position: absolute;
            height: 40px;
            top: 4px;
            background: var(--accent);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            color: white;
        }

        .clip.video-clip { background: #3b82f6; }
        .clip.audio-clip { background: #10b981; }
        .clip.text-clip { background: #f59e0b; }

        .upload-box {
            border: 2px dashed var(--border);
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .upload-box:hover {
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            🎬 StudioPro <span>AI Studio</span>
        </div>
        <div class="header-actions">
            <button class="btn" onclick="splitClip()">✂️ Böl (S)</button>
            <button class="btn btn-primary" onclick="exportVideo()">🚀 Dışa Aktar (Export)</button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        
        <!-- Left Sidebar -->
        <div class="left-panel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('media')">Medya</div>
                <div class="tab" onclick="switchTab('ai')">Yapay Zeka</div>
                <div class="tab" onclick="switchTab('text')">Metin</div>
                <div class="tab" onclick="switchTab('effects')">Efektler</div>
            </div>

            <!-- Media Tab -->
            <div id="tab-media" class="tab-content active">
                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    📁 Video/Görsel Yükle
                    <input type="file" id="fileInput" style="display:none" accept="video/*,audio/*,image/*" onchange="handleFileSelect(event)">
                </div>
                <div id="mediaLibrary" style="font-size:12px; color:var(--text-muted);">
                    Yüklenen medya zaman çizelgesine eklenir.
                </div>
            </div>

            <!-- AI Tab -->
            <div id="tab-ai" class="tab-content">
                <div class="upload-box" style="border-style:solid; border-color:var(--accent);">
                    ✨ <b>AI Auto Subtitle</b><br><span style="font-size:10px; color:var(--text-muted);">Sesleri metne dök</span>
                </div>
            </div>

            <!-- Text Tab -->
            <div id="tab-text" class="tab-content">
                <button class="btn" style="width:100%; justify-content:center; margin-bottom:8px;" onclick="addTextLayer('Standart Başlık')">+ Başlık Ekle</button>
            </div>

            <!-- Effects Tab -->
            <div id="tab-effects" class="tab-content">
                <div style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">Gerçek Zamanlı Filtreler:</div>
                <button class="btn" style="width:100%; justify-content:center; margin-bottom:6px;" onclick="setFilter('none')">Normal</button>
                <button class="btn" style="width:100%; justify-content:center; margin-bottom:6px;" onclick="setFilter('grayscale')">Siyah & Beyaz</button>
                <button class="btn" style="width:100%; justify-content:center; margin-bottom:6px;" onclick="setFilter('invert')">Negatif (Invert)</button>
                <button class="btn" style="width:100%; justify-content:center;" onclick="setFilter('blur')">Yumuşak Blur</button>
            </div>
        </div>

        <!-- Center Preview -->
        <div class="preview-area">
            <div class="aspect-ratios">
                <button class="ratio-btn active" onclick="setAspect(16, 9, this)">YouTube (16:9)</button>
                <button class="ratio-btn" onclick="setAspect(9, 16, this)">TikTok/Shorts (9:16)</button>
                <button class="ratio-btn" onclick="setAspect(1, 1, this)">Kare (1:1)</button>
            </div>
            <div class="canvas-container" id="canvasContainer">
                <canvas id="previewCanvas" width="1280" height="720"></canvas>
            </div>
            <div class="player-controls">
                <button class="control-btn" id="playBtn" onclick="togglePlay()">▶</button>
                <span id="timeDisplay" style="font-size:12px; font-family:monospace;">00:00 / 00:00</span>
            </div>
        </div>

        <!-- Right Properties Panel -->
        <div class="right-panel">
            <div class="panel-section">
                <h3>Video Özellikleri <button class="keyframe-btn" onclick="toggleKeyframe('scale')">◆ Anahtar Kare</button></h3>
                <div class="prop-row">
                    <span>Ölçek (Scale)</span>
                    <input type="range" min="0.5" max="2" step="0.1" value="1" id="scaleRange" oninput="updateProp('scale', this.value)">
                </div>
                <div class="prop-row">
                    <span>Orijinal Ses</span>
                    <input type="checkbox" id="audioToggle" checked onchange="toggleAudio(this.checked)">
                </div>
            </div>

            <div class="panel-section">
                <h3>Renk Ayarları</h3>
                <div class="prop-row">
                    <span>Parlaklık</span>
                    <input type="range" min="0" max="200" value="100" id="brightRange" oninput="updateProp('brightness', this.value)">
                </div>
                <div class="prop-row">
                    <span>Kontrast</span>
                    <input type="range" min="0" max="200" value="100" id="contrastRange" oninput="updateProp('contrast', this.value)">
                </div>
            </div>
        </div>

        <!-- Timeline Area -->
        <div class="timeline-area">
            <div class="timeline-toolbar">
                <button class="btn" style="padding:2px 8px; font-size:11px;">🔍 Yakınlaştır</button>
            </div>
            <div class="timeline-tracks-container">
                <div class="timeline-ruler"></div>
                <div class="track">
                    <div class="track-label">Video 1</div>
                    <div class="track-content" id="videoTrack"></div>
                </div>
                <div class="track">
                    <div class="track-label">Ses 1</div>
                    <div class="track-content" id="audioTrack"></div>
                </div>
                <div class="track">
                    <div class="track-label">Metin</div>
                    <div class="track-content" id="textTrack"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        let activeVideoElement = null;
        let isPlaying = false;
        
        let videoProps = {
            scale: 1,
            brightness: 100,
            contrast: 100,
            filter: 'none',
            keyframes: {}
        };

        function drawPlaceholder() {
            ctx.fillStyle = '#18181b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#71717a';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Önizleme Ekranı (Medya Yükleyin)', canvas.width / 2, canvas.height / 2);
        }
        drawPlaceholder();

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function setAspect(w, h, btn) {
            document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const container = document.getElementById('canvasContainer');
            if (w === 9) {
                container.style.width = '202px';
                container.style.height = '360px';
            } else if (w === 1) {
                container.style.width = '320px';
                container.style.height = '320px';
            } else {
                container.style.width = '560px';
                container.style.height = '315px';
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            document.getElementById('mediaLibrary').innerHTML = `✅ Yüklendi: <br><b>${file.name}</b>`;

            if (file.type.startsWith('video')) {
                activeVideoElement = document.createElement('video');
                activeVideoElement.src = fileURL;
                activeVideoElement.crossOrigin = 'anonymous';
                activeVideoElement.load();

                activeVideoElement.onloadedmetadata = () => {
                    renderVideoFrame();
                    updateTimeDisplay();
                };

                const videoTrack = document.getElementById('videoTrack');
                videoTrack.innerHTML = '';
                const newClip = document.createElement('div');
                newClip.className = 'clip video-clip';
                newClip.style.left = '0px';
                newClip.style.width = '300px';
                newClip.innerText = file.name;
                videoTrack.appendChild(newClip);
            }
        }

        function renderVideoFrame() {
            if (!activeVideoElement) return;
            
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Filtreleri ve renk ayarlarını uygula
            let filterString = `brightness(${videoProps.brightness}%) contrast(${videoProps.contrast}%)`;
            if (videoProps.filter === 'grayscale') filterString += ' grayscale(100%)';
            if (videoProps.filter === 'invert') filterString += ' invert(100%)';
            if (videoProps.filter === 'blur') filterString += ' blur(4px)';
            ctx.filter = filterString;

            // Ölçekleme (Scale)
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(videoProps.scale, videoProps.scale);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            ctx.drawImage(activeVideoElement, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            updateTimeDisplay();

            if (isPlaying && !activeVideoElement.ended) {
                requestAnimationFrame(renderVideoFrame);
            } else if (activeVideoElement.ended) {
                isPlaying = false;
                document.getElementById('playBtn').innerText = '▶';
            }
        }

        function togglePlay() {
            if (!activeVideoElement) {
                alert('Lütfen önce bir video dosyası yükleyin!');
                return;
            }

            isPlaying = !isPlaying;
            const playBtn = document.getElementById('playBtn');

            if (isPlaying) {
                activeVideoElement.play();
                playBtn.innerText = '⏸';
                renderVideoFrame();
            } else {
                activeVideoElement.pause();
                playBtn.innerText = '▶';
            }
        }

        function toggleAudio(isEnabled) {
            if (activeVideoElement) {
                activeVideoElement.muted = !isEnabled;
            }
        }

        function setFilter(filterName) {
            videoProps.filter = filterName;
            if (activeVideoElement && !isPlaying) renderVideoFrame();
        }

        function updateProp(propName, value) {
            videoProps[propName] = value;
            if (activeVideoElement && !isPlaying) renderVideoFrame();
        }

        function toggleKeyframe(prop) {
            const time = activeVideoElement ? activeVideoElement.currentTime : 0;
            if (!videoProps.keyframes[time]) videoProps.keyframes[time] = {};
            videoProps.keyframes[time][prop] = videoProps[prop];
            event.target.classList.toggle('active');
            alert(`Anahtar Kare (Keyframe) ${time.toFixed(1)} sn noktasına eklendi!`);
        }

        function updateTimeDisplay() {
            if (!activeVideoElement) return;
            const current = formatTime(activeVideoElement.currentTime);
            const duration = formatTime(activeVideoElement.duration || 0);
            document.getElementById('timeDisplay').innerText = `${current} / ${duration}`;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function splitClip() { alert('Klip bölündü.'); }
        function addTextLayer(text) {
            const textTrack = document.getElementById('textTrack');
            const newText = document.createElement('div');
            newText.className = 'clip text-clip';
            newText.style.left = '40px';
            newText.style.width = '100px';
            newText.innerText = text;
            textTrack.appendChild(newText);
        }
        function exportVideo() { alert('Dışa Aktarma (Export) başlatıldı!'); }
    </script>
</body>
</html>
